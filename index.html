<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neo Merge - 第41弾</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; touch-action: none; position: fixed; width: 100%; height: 100%; }
        
        #ad-top, #ad-bottom { position: fixed; left: 0; width: 100%; height: 100px; background: #333; z-index: 100; display: flex; align-items: center; justify-content: center; }
        #ad-top { top: 0; } #ad-bottom { bottom: 0; }

        #game-outer { position: absolute; top: 100px; bottom: 100px; left: 0; right: 0; background: #1e293b; overflow: hidden; }
        #game-canvas { width: 100%; height: 100%; cursor: crosshair; display: block; }
        
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
        .score-box { background: rgba(0,0,0,0.6); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: 1px solid #475569; }

        #dead-line { position: absolute; top: 60px; left: 0; width: 100%; height: 2px; background: rgba(255,0,0,0.4); border-top: 2px dashed #ef4444; pointer-events: none; }

        #menuScreen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; z-index: 50; padding-top: 20px; color: white;
        }
        .menu-btn { width: 260px; padding: 15px; font-size: 18px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; margin-top: 10px; }
        #retry-btn { background: #facc15; color: #000; }
        #more-games-btn { background: #ff4081; color: white; }
    </style>
</head>
<body>

    <div id="ad-top"><iframe src="ad.html" style="border:none;width:100%;height:100px;"></iframe></div>

    <div id="game-outer">
        <div id="ui-layer"><div class="score-box" id="score-val">SCORE: 0</div></div>
        <div id="dead-line"></div>
        <canvas id="game-canvas"></canvas>

        <div id="menuScreen">
            <h2 id="result-msg" style="color:#facc15; text-align:center;">Neo Merge</h2>
            <p style="text-align:center; font-size:13px; color:#cbd5e1; padding:0 20px;">
                タップでボールを投下！<br>同じ色をぶつけて大きくしよう。<br>赤い線を越えるとゲームオーバー！
            </p>
            <div class="menu-btn-group">
                <button id="retry-btn" class="menu-btn" onclick="startNewGame()">★ スタート ★</button>
                <a href="https://saaaachi.github.io/Grow-Planet/" id="more-games-btn" class="menu-btn">★ 他のゲームはこちら ★</a>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe src="ad.html" style="border:none;width:100%;height:100px;"></iframe></div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let score = 0, gameActive = false, balls = [];
        const ballTypes = [
            { r: 15, color: '#f87171', score: 2 }, { r: 24, color: '#fb923c', score: 4 },
            { r: 32, color: '#fbbf24', score: 8 }, { r: 42, color: '#a3e635', score: 16 },
            { r: 52, color: '#2dd4bf', score: 32 }, { r: 64, color: '#3b82f6', score: 64 },
            { r: 78, color: '#818cf8', score: 128 }, { r: 92, color: '#c084fc', score: 256 },
            { r: 105, color: '#db2777', score: 512 }
        ];

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        function startNewGame() {
            document.getElementById("menuScreen").style.display = "none";
            score = 0; balls = []; gameActive = true;
            document.getElementById('score-val').innerText = "SCORE: 0";
            requestAnimationFrame(update);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const level = Math.floor(Math.random() * 3);
            balls.push({ x, y: 30, vx: 0, vy: 2, level: level, r: ballTypes[level].r });
        });

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            // 物理挙動（簡易）
            for(let i=0; i<balls.length; i++) {
                let b = balls[i];
                b.vy += 0.25; // 重力
                b.x += b.vx; b.y += b.vy;
                b.vx *= 0.98; // 摩擦

                // 床・壁判定
                if(b.y + b.r > canvas.height) { b.y = canvas.height - b.r; b.vy *= -0.3; }
                if(b.x - b.r < 0) { b.x = b.r; b.vx *= -0.5; }
                if(b.x + b.r > canvas.width) { b.x = canvas.width - b.r; b.vx *= -0.5; }

                // ボール同士の衝突
                for(let j=i+1; j<balls.length; j++) {
                    let b2 = balls[j];
                    let dx = b2.x - b.x, dy = b2.y - b.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let minDist = b.r + b2.r;

                    if(dist < minDist) {
                        if(b.level === b2.level && b.level < ballTypes.length - 1) {
                            // 合体！
                            b.level++; b.r = ballTypes[b.level].r;
                            b.y -= 5; b.vy = -2;
                            score += ballTypes[b.level].score;
                            document.getElementById('score-val').innerText = "SCORE: " + score;
                            balls.splice(j, 1);
                            break;
                        }
                        // 押し出し
                        let angle = Math.atan2(dy, dx);
                        let moveX = Math.cos(angle) * (minDist - dist) / 2;
                        let moveY = Math.sin(angle) * (minDist - dist) / 2;
                        b.x -= moveX; b.y -= moveY;
                        b2.x += moveX; b2.y += moveY;
                        b.vx -= moveX * 0.1; b.vy -= moveY * 0.1;
                        b2.vx += moveX * 0.1; b2.vy += moveY * 0.1;
                    }
                }

                // 描画
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fillStyle = ballTypes[b.level].color;
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.stroke();

                // オーバー判定
                if(b.y < 60 && Math.abs(b.vy) < 0.5 && b.y > 0) {
                    gameOver();
                }
            }
            if(gameActive) requestAnimationFrame(update);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById("result-msg").innerHTML = "あふれちゃった！😱<br>SCORE: " + score;
            document.getElementById("menuScreen").style.display = "flex";
        }

        window.onload = () => { resize(); document.getElementById("menuScreen").style.display = "flex"; };
    </script>
</body>
</html>
